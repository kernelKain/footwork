[project]
name = "footwork-api"
version = "0.1.0"
requires-python = "==3.12.12"
dependencies = [
    "fastapi==0.143.0",
    "gradio-client==2.7.2",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
