<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080C18" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("footwork-theme");
        } catch (error) {}
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : light ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#F4F1E8" : "#080C18");
      })();
    </script>
    <meta
      name="description"
      content="A walk becomes a short instrumental piece and a Soundprint that moves with it."
    />
    <meta property="og:title" content="Footwork" />
    <meta
      property="og:description"
      content="Your route is the score. Your movement is the performance."
    />
    <meta property="og:image" content="/brand/og.svg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch.svg" />
    <title>Footwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
